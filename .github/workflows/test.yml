name: Protocol Test Suite & Invariant Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Invariant Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Mathematical SDK Tests
        run: bun test/sdk.test.mjs

      - name: Run Integration Preview
        run: bun examples/preview.mjs
